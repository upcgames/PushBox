<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PushBox Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    select {
      background: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 1rem;
      outline: none;
    }
    
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }

    /* Scaled down canvas container */
    .console-frame {
      background: #000;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.8);
      /* Use CSS transform to make it smaller as requested */
      transform: scale(0.7);
      transform-origin: top center;
      margin-bottom: -150px; /* Adjust layout offset due to scaling */
    }
    canvas {
      image-rendering: pixelated;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🎬 Animation Gallery</div>
    <a href="/" class="nav-link">← Back to Game</a>
  </header>

  <div class="gallery-container">
    <div class="controls">
      <select id="animationSelect"></select>
      <button id="playBtn">Play Animation</button>
    </div>

    <!-- Hidden element to force font load -->
    <div style="font-family: 'Px437'; opacity: 0; position: absolute; pointer-events: none;">.</div>

    <div class="console-frame">
      <canvas id="gameCanvas" width="640" height="504"></canvas>
    </div>
  </div>

  <!-- We use module scripts so it loads asynchronously -->
  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
