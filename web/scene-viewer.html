<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelmen POC - Double Buffered Generator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .canvas-container {
            position: relative;
            width: 1120px; /* 80 cols * 14px */
            height: 882px; /* 63 rows * 14px */
            border: 2px solid #444;
            margin-top: 20px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #baseCanvas {
            z-index: 1;
            background-color: #000;
        }
        #animCanvas {
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to base if needed */
        }
    </style>
    
    <!-- Load required fonts - use same CGA as main/shared.css -->
    <style>
        @font-face {
            font-family: 'Px437';
            src: url('/fonts/Px437_IBM_CGA.ttf') format('truetype');
        }
    </style>
</head>
<body>
    <h1>Pixelmen POC</h1>
    <p>Using Generator (`yield`) and Double Buffering over RAF</p>
    <div class="controls" style="display:flex; gap:12px; align-items:center; background:#2a2a2a; border:1px solid #444; padding:12px 20px; border-radius:8px;">
        <select id="animSelect" style="background:#000; color:#fff; border:1px solid #444; padding:8px 16px; border-radius:6px;"></select>
        <button id="playBtn" style="background:#22c55e; color:#000; border:none; padding:8px 20px; border-radius:6px; font-weight:700; cursor:pointer;">Play Animation</button>
        <span id="status" style="opacity:0.7; font-size:0.9rem;"></span>
    </div>
    <div class="canvas-container">
        <!-- Base canvas for gameplay/static backgrounds -->
        <canvas id="baseCanvas" width="1120" height="882"></canvas>
        <!-- Overlay canvas for transparent animations -->
        <canvas id="animCanvas" width="1120" height="882"></canvas>
    </div>

    <!-- Make audio available globally for the shims -->
    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
    </script>
    
    <script type="module" src="/src/scene-viewer/main.js"></script>
</body>
</html>
