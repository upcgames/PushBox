<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PushBox - Retro Console Web Port</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/src/styles/launcher.css">
  <link rel="stylesheet" href="/src/styles/canvas.css">
  <link rel="stylesheet" href="/src/styles/rotate.css">
  <link rel="stylesheet" href="/src/styles/mobile.css">
  <link rel="stylesheet" href="/src/styles/mute.css">
  <script>try{var m=matchMedia('(pointer: coarse)').matches?'mobile':'desktop',o=matchMedia('(orientation: landscape)').matches?'landscape':'portrait';document.documentElement.dataset.shell=m;document.documentElement.dataset.orientation=o;}catch(e){}</script>
</head>
<body>
  <header>
    <div class="brand">🕹️ PushBox <span style="font-size:0.9rem; color:var(--accent); font-weight:600;">Generated Modules Runtime</span></div>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="/map-viewer.html" class="nav-link">🗺️ Map Viewer</a>
      <a href="/scene-viewer.html" class="nav-link">🎬 Scene Viewer</a>
      <a href="./mobile-inspector.html" class="nav-link">Mobile inspector</a>
    </div>
  </header>

  <div class="console-frame" style="position: relative;">
    <div id="launcherOverlay" class="launcher-overlay">
      <div class="launcher-title">PUSHBOX</div>
      
      <div class="dev-options">
        <h3>🛠️ Dev Configuration</h3>
        <div class="dev-row">
          <label for="startLevel">Start Point:</label>
          <select id="startLevel">
          </select>
        </div>
        <div class="dev-row">
          <label for="skipLore">Skip Lore Screens:</label>
          <input type="checkbox" id="skipLore">
        </div>
      </div>

      <button id="startBtn" class="start-btn" disabled>Loading Fonts...</button>
    </div>
    <div id="muteBtn" class="mute-btn"></div>
    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="1120" height="882"></canvas>
    </div>
  </div>

  <div id="controllerArea" class="controller-area"></div>

  <div id="rotateOverlay" class="rotate-overlay" aria-hidden="true">
    <div class="rotate-icon">📱↻</div>
    <div class="rotate-text">Please rotate to portrait</div>
    <div class="rotate-sub">This game is designed for portrait mode</div>
  </div>

  <script type="module" src="/src/game.js"></script>
</body>
</html>
