<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelmen POC - Double Buffered Generator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .canvas-container {
            position: relative;
            width: 1120px; /* 80 cols * 14px */
            height: 840px; /* 60 rows * 14px */
            border: 2px solid #444;
            margin-top: 20px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #baseCanvas {
            z-index: 1;
            background-color: #000;
        }
        #animCanvas {
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to base if needed */
        }
    </style>
    
    <!-- Load required fonts -->
    <style>
        @font-face {
            font-family: 'Px437';
            src: url('/fonts/Px437_IBM_VGA_8x16.ttf') format('truetype');
        }
    </style>
</head>
<body>
    <h1>Pixelmen POC</h1>
    <p>Using Generator (`yield`) and Double Buffering over RAF</p>
    
    <div class="canvas-container">
        <!-- Base canvas for gameplay/static backgrounds -->
        <canvas id="baseCanvas" width="1120" height="840"></canvas>
        <!-- Overlay canvas for transparent animations -->
        <canvas id="animCanvas" width="1120" height="840"></canvas>
    </div>

    <!-- Make audio available globally for the shims -->
    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
    </script>
    
    <script type="module" src="/src/gallery-2/main.js"></script>
</body>
</html>
